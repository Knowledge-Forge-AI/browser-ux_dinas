[browser-ux]
schema = 1

[browser-ux.keepassxc]
enable = true

[browser-ux.extensions]
default-on-opt-out = []

[browser-ux.extensions.apple-proton-trial]
enable = false
host = "example-current-mac"
vivaldi-vpn-route = "standalone"
integrated-vpn-id = ""

[browser-ux.replacements.vivaldi]
enable = false
inherit-from = "chrome"

[browser-ux.replacements.vivaldi.mail]
enable = false
preserve-resolved = false

[browser-ux.replacements.floorp]
enable = false
inherit-from = "firefox"
